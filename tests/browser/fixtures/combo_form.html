<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Combo form page</title>
<style>body { font: 14px Arial, sans-serif; margin: 16px; }</style>
</head>
<body>
  <h1>Join the walking group</h1>
  <form action="/join" method="post">
    <p><label for="f0">First name</label><br><input id="f0" name="f0" type="text"></p>
    <p><label for="f1">Last name</label><br><input id="f1" name="f1" type="text"></p>
    <p><label for="f2">Email</label><br><input id="f2" name="f2" type="email"></p>
    <p><label for="f3">Phone</label><br><input id="f3" name="f3" type="tel"></p>
    <p><label for="f4">Street</label><br><input id="f4" name="f4" type="text"></p>
    <p><label for="f5">Town</label><br><input id="f5" name="f5" type="text"></p>
    <p><label for="f6">Postcode</label><br><input id="f6" name="f6" type="text"></p>
    <p><button type="submit">Send</button></p>
  </form>
</body>
</html>
