<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Picture basic page</title>
<style>
  body { font: 16px Arial, sans-serif; margin: 0; padding: 16px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  figure { margin: 0; }
  #far { margin-top: 3000px; }
</style>
</head>
<body>
  <header><img id="logo" src="img/logo.svg" alt="Site logo" width="32" height="32"> Trip photos</header>
  <div class="row">
    <figure>
      <img id="bridge" src="img/bridge-400.svg" srcset="img/bridge-400.svg 400w, img/bridge-1600.svg 1600w"
           sizes="400px" width="400" height="300" alt="Golden Gate Bridge at sunset. Taken from the north side.">
    </figure>
    <figure>
      <img id="tram" src="img/tram.svg" width="300" height="200">
      <figcaption>A red tram climbing a hill</figcaption>
    </figure>
    <div>
      <img id="lighthouse" src="img/lighthouse.svg" width="300" height="220" aria-labelledby="lh-label">
      <p id="lh-label">Lighthouse on the rocky coast</p>
    </div>
  </div>
  <div class="row">
    <img id="decor" src="img/plain.svg" width="300" height="200" alt="">
    <img id="dog" src="img/dog.svg" width="300" height="200">
  </div>
  <p>Our trip to San Francisco, with a few of the best photos.</p>
  <img id="far" src="img/lake.svg" width="300" height="200" alt="Mountain lake">
</body>
</html>
