<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clutter: shadow roots, iframes, paywall</title>
<style>
  body { margin: 0; font: 16px/1.5 sans-serif; }
  #sp_message_container_99 { position: fixed; inset: auto 0 0 0; height: 120px; z-index: 30; }
  #sp_message_container_99 iframe { width: 100%; height: 100%; border: 0; background: #ddd; }
  .paywall { position: fixed; left: 0; right: 0; bottom: 0; background: #fffbe6; padding: 16px; z-index: 20; }
  .ad-label { width: 300px; height: 100px; background: #eee; }
</style>
</head>
<body>
<article><h1>A news story</h1><p>First paragraph of the story.</p>
  <ins class="adsbygoogle" style="display:block;width:300px;height:100px;background:#eee"></ins>
  <div class="ad-label" aria-label="Advertisement">Sponsored</div>
  <a href="/advertise" aria-label="Advertise with us">Advertise with us</a>
</article>
<div id="usercentrics-root"></div>
<promo-bar></promo-bar>
<div id="sp_message_container_99"><iframe title="SP Consent Message"></iframe></div>
<div class="paywall">Subscribe to continue reading. Already a subscriber? <a href="/login">Log in</a></div>
<script>
  const uc = document.getElementById("usercentrics-root").attachShadow({ mode: "closed" });
  uc.innerHTML = '<div style="position:fixed;top:0;left:0;right:0;background:#fff;padding:12px;border-bottom:1px solid #000">We use cookies and similar tools. <button>Accept</button></div>';
  customElements.define("promo-bar", class extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: "open" }).innerHTML =
        '<div style="position:fixed;top:60px;right:0;width:260px;background:#ffe;padding:12px">Get the app for faster shopping. <a href="/app">Download</a></div>';
    }
  });
</script>
</body>
</html>
