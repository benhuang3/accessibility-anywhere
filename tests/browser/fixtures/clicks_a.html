<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Clicks page A</title>
<style>
  body { font: 16px Arial, sans-serif; margin: 0; padding: 16px; }
  header { display: flex; gap: 16px; align-items: center; margin-bottom: 16px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
  #cookies { position: fixed; left: 0; right: 0; bottom: 0; height: 90px; background: #333; color: #fff; padding: 12px; z-index: 5; }
  #under { position: fixed; left: 20px; bottom: 30px; z-index: 1; }
  #far { margin-top: 2000px; }
</style>
</head>
<body>
  <header>
    <a id="back" href="clicks_b.html?from=back">Back</a>
    <strong>Clicks test</strong>
    <button id="signin-top" type="button">Sign in</button>
  </header>
  <div class="row">
    <a id="to-b" href="clicks_b.html">Go to page B</a>
    <button id="add" type="button">Add one</button> <span id="count">0</span>
    <a id="help" href="clicks_b.html?help=1" target="_blank">Open help</a>
  </div>
  <form class="row" id="form" onsubmit="return false">
    <label for="email">Email</label> <input id="email" type="text">
    <label><input id="remember" type="checkbox"> Remember me</label>
    <button id="signin-form" type="button">Sign in</button>
    <button id="buy" type="button">Buy now</button>
  </form>
  <div class="row">
    <a id="menu" href="#">Menu</a> <span id="menu-state"></span>
    <a id="card" href="clicks_b.html?card=1" style="display:inline-block;padding:8px;border:1px solid #999">Blue kettle
      <button id="save" type="button">Save for later</button></a> <span id="saved"></span>
    <button id="trash" type="button" style="width:40px;height:40px"><svg width="20" height="20" viewBox="0 0 20 20"><rect width="20" height="20"/></svg></button>
    <span id="trash-state"></span>
  </div>
  <a id="under" href="#hidden">Hidden link</a>
  <div id="cookies">We use cookies. (This bar covers a link.)</div>
  <button id="far" type="button">Far button</button>
  <script src="clicks_a.js"></script>
</body>
</html>
