<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Combo login page</title></head>
<body>
  <h1>Sign in</h1>
  <form action="/session" method="post">
    <p><label for="user">Email</label><br><input id="user" type="email" autocomplete="username"></p>
    <p><label for="pw">Password</label><br><input id="pw" type="password" autocomplete="current-password"></p>
    <p><button type="submit">Sign in</button></p>
  </form>
</body>
</html>
