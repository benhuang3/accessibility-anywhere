<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Inner scroller</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; font: 18px Arial, sans-serif; }
  header { height: 60px; background: #eee; padding: 12px; box-sizing: border-box; }
  #mail { position: absolute; top: 60px; bottom: 0; left: 0; right: 0; overflow-y: auto; padding: 16px; }
</style>
</head>
<body>
  <header>Mail</header>
  <div id="mail"></div>
  <script src="scroll_inner.js"></script>
</body>
</html>
