# Warning wording for scam and risk protection, in one place. Edit freely, `python -m unittest test_risk_copy`
# checks the rules below.
#
# Rules: say what we see, why it matters, offer one action. Spoken lines make no offer: Ally asks the yes/no
# question right after them, so a question here would be asked twice. Hedge ("may", "looks like"). Never blame, no
# capital-letter shouting, no exclamation marks, no phone numbers. The first action is the safe default.
# Placeholders: {tool} {host} {usual_site}; {scare} is filled by warning_for for fake scans.
# Action ids are what the agent runs, and only after a yes:
#   close_page  close this tab          close_tool  close the remote-control tool
#   open_usual  open {usual_site}       go_back     go back to the previous page
#   explain     explain, change nothing  stay        do nothing
# Use {tool} / {host} / {usual_site} only where the matching field is always supplied (see copy.py).

[confirm_close]
title = "Are you sure?"
body = "Scammers often say it's safe to continue."
spoken = "Let's pause. Scammers often say it's safe to continue."
# Action results use the same wording on screen and aloud.
closed_tool = "Closed {tool}."
closed_page = "Closed the page."
tool_close_failed_page = "I closed the bank page. I can't close {tool} myself. Please click the X on its window."
tool_close_failed = "I can't close {tool} myself. Please click the X on its window, then hang up the phone."
[[confirm_close.actions]]
id = "close_page"
label = "Close it"
[[confirm_close.actions]]
id = "stay"
label = "Keep it open"

[scam_popup]
title = "This message may not be real."
body = "A page says your computer is infected and asks you to call a number. Real Windows warnings never ask you to call. Your computer may be fine."
spoken = "Let's pause for a second. This page says your computer has a virus and asks you to call a number. Real Windows warnings never include a phone number, so it may be a trick."
[[scam_popup.actions]]
id = "close_page"
label = "Close this page"
[[scam_popup.actions]]
id = "explain"
label = "Tell me more"

[remote_access]
title = "Someone may be able to control this computer."
body = "{tool} just opened. If you didn't start it, or someone on the phone asked you to, it's safest to close it."
spoken = "{tool} just opened. It lets another person see and control this computer. If you didn't start it yourself, it's safest to close it."
[[remote_access.actions]]
id = "close_tool"
label = "Close it"
[[remote_access.actions]]
id = "stay"
label = "I know this person"

[fake_scan]
title = "This is a common scam trick."
body = "Someone connected to your computer just opened {scare}. Scammers show normal Windows messages to make it look broken. Your computer is probably fine."
spoken = "Let's pause because scammers may use normal Windows tools to make your computer look broken."
[[fake_scan.actions]]
id = "close_tool"
label = "Close the remote tool"
[[fake_scan.actions]]
id = "explain"
label = "Tell me more"

[page_tricks]
title = "This page may be trying to trap you."
body = "It is stopping you from leaving or taking over the screen. It's safest to close this page."
spoken = "This page may be stopping you from leaving or taking over the screen. It's safest to close it."
[[page_tricks.actions]]
id = "close_page"
label = "Close this page"
[[page_tricks.actions]]
id = "explain"
label = "Tell me more"

[untrusted_site]
title = "This address looks a little different."
body = "You're on {host}. The real site is {usual_site}."
spoken = "This address looks slightly different from the real site's usual address, so it may not be the real one."
[[untrusted_site.actions]]
id = "open_usual"
label = "Go to the usual site"
[[untrusted_site.actions]]
id = "stay"
label = "Stay here"

[untrusted_site_generic]
title = "This address looks a little different."
body = "You're on {host}. It looks a bit like a well-known website, but it isn't quite the same."
spoken = "This address looks a bit like a well-known website, but it isn't quite the same."
[[untrusted_site_generic.actions]]
id = "go_back"
label = "Take me back"
[[untrusted_site_generic.actions]]
id = "stay"
label = "Stay here"

[payment_field]
title = "Before you enter card details."
body = "I don't recognise this website. New shops are fine, but a quick check first is wise."
spoken = "You're about to type card details on a website I don't know, so let's take a careful look first."
[[payment_field.actions]]
id = "explain"
label = "Check with me"
[[payment_field.actions]]
id = "stay"
label = "Continue"

[joined_remote_payment]
title = "Let's pause."
body = "Someone may be able to see this screen while you're on a banking or payment page."
spoken = "Someone may be able to see your screen right now while you're on a banking or payment page. I'd feel better if we paused."
[[joined_remote_payment.actions]]
id = "close_tool"
label = "Close the remote tool"
[[joined_remote_payment.actions]]
id = "stay"
label = "It's okay"
